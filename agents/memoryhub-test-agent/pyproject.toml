[project]
name = "memoryhub-test-agent"
version = "0.1.0"
description = "Test agent demonstrating MemoryHub integration with Kagenti ADK — governed cross-session memory for AI agents."
readme = "README.md"
authors = [{ name = "Wes Jackson" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "kagenti-adk[memoryhub]",
    "httpx",
    "openai",
]

[project.scripts]
server = "memoryhub_test_agent.agent:run"

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
kagenti-adk = { path = "../../apps/adk-py", editable = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
